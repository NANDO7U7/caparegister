<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia — SIGECAP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 35, 111, 0.1);
            max-width: 480px;
            width: 100%;
            padding: 32px 24px;
            border: 1px solid #e2e8f0;
        }
        .logo-box {
            width: 48px;
            height: 48px;
            background: #0051d5;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
        }
        h2 { font-size: 20px; font-weight: 800; color: #00236f; text-align: center; margin-bottom: 6px; }
        .course-badge {
            background: #e0e7ff;
            color: #1e3a8a;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
            display: block;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 16px; }
        label { font-size: 12px; font-weight: 700; color: #475569; display: block; margin-bottom: 6px; }
        .input-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .input-control:focus {
            border-color: #0051d5;
            box-shadow: 0 0 0 3px rgba(0, 81, 213, 0.15);
        }
        .btn-submit {
            width: 100%;
            background: #0051d5;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0, 81, 213, 0.3);
            margin-top: 10px;
        }
        .btn-submit:hover { background: #003db3; }
        .alert-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-box">
            <span class="material-symbols-outlined" style="font-size: 28px;">how_to_reg</span>
        </div>
        
        <h2>Confirmar Asistencia</h2>
        <span class="course-badge">{{ capacitacion.codigo }} — {{ capacitacion.nombre }}</span>

        {% if messages %}
            {% for m in messages %}
            <div class="alert-error">{{ m }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="identificador">Código de Empleado, DNI o Correo Institucional:</label>
                <input type="text" id="identificador" name="identificador" required autofocus class="input-control" placeholder="Ej. DOC-0042 o 0801-1985-12345">
            </div>

            <div style="text-align: center; font-size: 11px; color: #64748b; margin-bottom: 16px;">
                O selecciona tu nombre del padrón:
            </div>

            <div class="form-group">
                <select onchange="if(this.value) document.getElementById('identificador').value = this.value;" class="input-control" style="font-size: 13px;">
                    <option value="">-- Seleccionar mi nombre --</option>
                    {% for p in personas %}
                    <option value="{{ p.codigo_empleado }}">{{ p.nombre_completo }} ({{ p.codigo_empleado }})</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn-submit">
                <span class="material-symbols-outlined">check_circle</span>
                <span>Registrar Asistencia Ahora</span>
            </button>
        </form>
    </div>
</body>
</html>
