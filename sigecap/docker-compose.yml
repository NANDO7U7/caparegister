version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sigecap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Configura DB_NAME}
      POSTGRES_USER: ${DB_USER:?Configura DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sigecap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sigecap_postgres_data:
    name: sigecap_postgres_data
